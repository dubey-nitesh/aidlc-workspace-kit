name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        no_symlinks: ['0']
        include:
          # GitHub's Windows runners can make symlinks; most Windows machines
          # (no Developer Mode) can't. This job takes that path: folders as
          # junctions, files in copy mode.
          - os: windows-latest
            no_symlinks: '1'
    name: test (${{ matrix.os }}${{ matrix.no_symlinks == '1' && ', no symlinks' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      AIDLC_KIT_SIMULATE_NO_SYMLINKS: ${{ matrix.no_symlinks }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Use macOS's own bash 3.2 (the oldest bash the kit supports)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32" && ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - run: bash --version | head -n 1 && git --version
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: bash tests/core.sh
      - run: bash tests/save.sh
      - run: bash tests/hooks.sh
      - run: bash tests/rules.sh
      - run: bash tests/migrate.sh
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/aidlc-kit lib/*.sh tests/*.sh
